<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>PATLOK – Typeface Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>PATLOK</h1>

    <!-- POP-UP WARNING -->
        <script>
            window.onload = function () {
                alert("WARNING:\n!! UNAUTHORIZED ACCESS DETECTED !!");
                alert("SYSTEM REQUIRES IMMEDIATE COUNTER-PATTERN.");
            };
        </script>

    <div class="layout">
        <!-- LEFT: reveal typeface -->
        <div class="left-panel">
            <div class="pangram-label">PASSWORD:</div>
            <div id="revealedText" class="pangram-text"></div>
        </div>

        <!-- RIGHT: code hint + pattern lock -->
        <div class="right-panel">
            <div class="code-row">
                <span class="code-label">CODE:</span>
                <span class="code-line"></span>
                <span id="codeValue" class="code-value"></span>
            </div>

            <div id="statusMsg" class="status-msg"></div>

            <!-- Pattern Lock -->
            <svg class="patternlock" id="lock" viewBox="0 0 100 100"
                 xmlns="http://www.w3.org/2000/svg">
                <g class="lock-actives"></g>
                <g class="lock-lines"></g>
                <g class="lock-dots">
                    <!-- Row 1 -->
                    <circle cx="20" cy="20" r="2"/>
                    <circle cx="50" cy="20" r="2"/>
                    <circle cx="80" cy="20" r="2"/>

                    <!-- Row 2 -->
                    <circle cx="20" cy="50" r="2"/>
                    <circle cx="50" cy="50" r="2"/>
                    <circle cx="80" cy="50" r="2"/>

                    <!-- Row 3 -->
                    <circle cx="20" cy="80" r="2"/>
                    <circle cx="50" cy="80" r="2"/>
                    <circle cx="80" cy="80" r="2"/>
                </g>
            </svg>
        </div>
    </div>

    <!-- Always-visible buttons -->
    <button id="skipBtn" class="skip-button">REVEAL PASSWORD</button>
    <button id="nextPageBtn" class="next-button">TRY THE FONT →</button>

    <!-- jQuery + JS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="app.js"></script>

</body>
</html>
